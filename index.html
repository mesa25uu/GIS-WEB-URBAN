<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Urban Map - Oxnehaga</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">

<style>
html, body {
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  display:flex;
  font-family:'Segoe UI', sans-serif;
}

#sidePanel {
  width:280px;
  background:#1f2a38;
  color:white;
  padding:20px;
  overflow-y:auto;
}

#viewDiv {
  flex:1;
  height:100vh;
  position:relative;
}

#infoPanel {
  position:absolute;
  top:20px;
  right:20px;
  width:340px;
  max-height:75vh;
  overflow-y:auto;
  background:white;
  border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  border:1px solid #ccc;
  z-index:10;
}

.info-header {
  background:#4A90E2;
  color:white;
  padding:10px 15px;
  border-radius:8px 8px 0 0;
  font-weight:bold;
}

#infoContent {
  padding:15px;
  font-size:13px;
}

.layer-item {
  margin-bottom:8px;
  display:flex;
  align-items:center;
  background:rgba(255,255,255,0.1);
  padding:8px;
  border-radius:4px;
}

.layer-item input {
  margin-right:10px;
}

.dropdown {
  margin-bottom:10px;
}

.dropdown-header {
  cursor:pointer;
  font-weight:bold;
  padding:8px;
  background:rgba(255,255,255,0.15);
  border-radius:4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dropdown-arrow {
  transition:0.3s;
}

.dropdown-content {
  display:none;
  margin-top:5px;
  padding-left:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

td {
  padding:6px 4px;
  border-bottom:1px solid #eee;
  vertical-align:top;
}

.attr-key {
  font-weight:bold;
  color:#666;
  width:45%;
  font-size:11px;
  text-transform:uppercase;
}

#project4Btn {
  width:100%;
  padding:8px;
  background:#4A90E2;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:15px;
}

.feature-title {
  margin:0 0 8px 0;
  color:#4A90E2;
  font-size:18px;
}

.feature-type {
  display:inline-block;
  background:#eef5ff;
  color:#2b6cb0;
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:10px;
}

.small-note {
  font-size:12px;
  color:#666;
  margin-bottom:10px;
}

.search-box{width:100%;box-sizing:border-box;padding:8px;margin:8px 0 12px;border-radius:4px;border:0;}
.legend-row{font-size:12px;margin:6px 0;opacity:.95;}
.status{font-size:12px;color:#cbd5e1;margin-top:10px;line-height:1.4;}
</style>
</head>

<body>

<div id="sidePanel">
  <h2 style="color:#4A90E2;margin:0;">GIS Web Urban</h2>
  <p style="font-size:12px;opacity:0.8;margin-top:6px;">Oxnehaga Urban Services Map</p>
  <hr style="opacity:0.2;margin:15px 0;">
  <div id="controls"></div>
</div>

<div id="viewDiv">
  <div id="infoPanel">
    <div class="info-header">Feature Details</div>
    <button id="project4Btn" style="display:none;">Open Project 4</button>
    <div id="infoContent">Click on a feature to see its details.</div>
  </div>
</div>

<script src="https://js.arcgis.com/4.29/"></script>

<script src="https://js.arcgis.com/4.29/"></script>

<script>
require([
  "esri/Map",
  "esri/views/SceneView",
  "esri/layers/GeoJSONLayer",
  "esri/layers/FeatureLayer",
  "esri/Graphic",
  "esri/widgets/Home"
], function(Map, SceneView, GeoJSONLayer, FeatureLayer, Graphic, Home) {

  // ---------------- MAP AND VIEW ----------------
  const map = new Map({
    basemap: "topo-vector",
    ground: "world-elevation"
  });

  const view = new SceneView({
    container: "viewDiv",
    map: map,
    camera: {
      position: { longitude: 14.2622409, latitude: 57.7781582, z: 5000 },
      tilt: 0
    },
    popupEnabled: false
  });

  view.ui.add(new Home({ view: view }), "top-left");

  // ---------------- ICON URLS ----------------
  const ICONS = {
    bus: "https://static.arcgis.com/images/Symbols/Transportation/Bus.png",
    school: "https://static.arcgis.com/images/Symbols/Education/School.png",
    kindergarten: "https://static.arcgis.com/images/Symbols/PeoplePlaces/ChildCare.png",
    hospital: "https://static.arcgis.com/images/Symbols/Health/Hospital.png",
    restaurant: "https://static.arcgis.com/images/Symbols/PeoplePlaces/Restaurant.png",
    train: "https://static.arcgis.com/images/Symbols/Transportation/Train.png",
    defaultPoint: "https://static.arcgis.com/images/Symbols/Shapes/BluePin1LargeB.png"
  };

  function pictureSymbol(url, size) {
    return { type: "picture-marker", url, width: size || "26px", height: size || "26px" };
  }

  function simplePictureRenderer(url, size) {
    return { type: "simple", symbol: pictureSymbol(url, size) };
  }

  // ---------------- SMART CLASSIFICATION ----------------
  // This fixes the earlier problem where all points appeared as bus stops.
  // It checks many possible OSM/GeoJSON fields and text values, then creates a clean category.
  function textFromProperties(properties) {
    const keys = [
      "amenity", "type", "category", "fclass", "service", "highway",
      "public_transport", "railway", "healthcare", "shop", "tourism",
      "name", "namn", "operator", "description"
    ];
    return keys.map(k => properties?.[k] || properties?.[k.toUpperCase()] || properties?.[capitalize(k)] || "")
      .join(" ").toLowerCase();
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function getBestName(properties) {
    const keys = ["name", "Name", "NAME", "namn", "Namn", "NAMN", "title", "operator", "objektidentitet"];
    for (const key of keys) {
      if (properties && properties[key] !== undefined && properties[key] !== null && String(properties[key]).trim() !== "") {
        return String(properties[key]).trim();
      }
    }
    return "Unknown feature";
  }

  function classifyProperties(properties, layerTitle = "") {
    const raw = (textFromProperties(properties) + " " + layerTitle).toLowerCase();

    if (raw.includes("restaurant") || raw.includes("cafe") || raw.includes("fast_food") || raw.includes("food") || raw.includes("pizza") || raw.includes("grill") || raw.includes("bar") || raw.includes("pub")) {
      return { key: "restaurant", label: "Restaurant / Food Place", icon: "🍽️", symbol: pictureSymbol(ICONS.restaurant, "28px") };
    }
    if (raw.includes("hospital") || raw.includes("clinic") || raw.includes("doctor") || raw.includes("healthcare") || raw.includes("vård") || raw.includes("vard") || raw.includes("medical") || raw.includes("pharmacy") || raw.includes("apotek")) {
      return { key: "hospital", label: "Hospital / Healthcare", icon: "🏥", symbol: pictureSymbol(ICONS.hospital, "30px") };
    }
    if (raw.includes("kindergarten") || raw.includes("förskola") || raw.includes("forskola") || raw.includes("childcare") || raw.includes("preschool")) {
      return { key: "kindergarten", label: "Kindergarten", icon: "🧒", symbol: pictureSymbol(ICONS.kindergarten, "28px") };
    }
    if (raw.includes("school") || raw.includes("skola")) {
      return { key: "school", label: "School", icon: "🏫", symbol: pictureSymbol(ICONS.school, "28px") };
    }
    if (raw.includes("train") || raw.includes("station") || raw.includes("railway")) {
      return { key: "train", label: "Train Station / Railway", icon: "🚆", symbol: pictureSymbol(ICONS.train, "30px") };
    }
    if (raw.includes("bus_stop") || raw.includes("bus stop") || raw.includes("bus") || raw.includes("public_transport") || raw.includes("platform")) {
      return { key: "bus", label: "Bus Stop", icon: "🚌", symbol: pictureSymbol(ICONS.bus, "28px") };
    }
    if (raw.includes("building") || raw.includes("byggnad")) {
      return { key: "building", label: "Building", icon: "🏢", symbol: pictureSymbol(ICONS.defaultPoint, "24px") };
    }
    return { key: "other", label: "Other Service Point", icon: "📍", symbol: pictureSymbol(ICONS.defaultPoint, "24px") };
  }

  // ---------------- RENDERERS ----------------
  const areaRenderer = { type:"simple", symbol:{ type:"simple-fill", color:[0,0,0,0], outline:{ color:"#00aa00", width:3 } } };
  const trainLineRenderer = { type:"simple", symbol:{ type:"simple-line", color:"#ff0000", width:4, style:"dash" } };
  const schoolRouteRenderer = { type:"simple", symbol:{ type:"simple-line", color:"#8A2BE2", width:5 } };
  const vardcentralWalkingRenderer = { type:"simple", symbol:{ type:"simple-fill", color:[0,200,0,0.35], outline:{ color:[0,150,0], width:2 } } };
  const distanceRenderer = { type:"simple", symbol:{ type:"simple-fill", color:[255,165,0,0.3], outline:{ color:[255,140,0], width:2 } } };

  const buildingRenderer = {
    type: "unique-value",
    field: "objektidentitet",
    defaultSymbol: { type: "polygon-3d", symbolLayers: [{ type: "extrude", size: 2, material: { color: "#d9d9d9" }, edges: { type: "solid", color: "#888", size: 0.6 } }] },
    uniqueValueInfos: [{
      value: "86068c15-afde-4284-90fc-ad8735b25416",
      symbol: { type: "polygon-3d", symbolLayers: [{ type: "extrude", size: 2, material: { color: "#ff0000" }, edges: { type: "solid", color: "#888", size: 0.6 } }] }
    }]
  };

  const serviceRenderer = {
    type: "unique-value",
    field: "category",
    defaultSymbol: pictureSymbol(ICONS.defaultPoint, "24px"),
    uniqueValueInfos: [
      { value: "bus", symbol: pictureSymbol(ICONS.bus, "28px"), label: "Bus Stop" },
      { value: "restaurant", symbol: pictureSymbol(ICONS.restaurant, "28px"), label: "Restaurant / Cafe" },
      { value: "hospital", symbol: pictureSymbol(ICONS.hospital, "30px"), label: "Healthcare" },
      { value: "school", symbol: pictureSymbol(ICONS.school, "28px"), label: "School" },
      { value: "kindergarten", symbol: pictureSymbol(ICONS.kindergarten, "28px"), label: "Kindergarten" },
      { value: "train", symbol: pictureSymbol(ICONS.train, "30px"), label: "Train" }
    ]
  };

  // ---------------- NORMAL GEOJSON LAYERS ----------------
  const areaLayer = new GeoJSONLayer({ title: "Oxnehaga Area Boundary", url: "Oxnehaga-Area.geojson", renderer: areaRenderer, outFields: ["*"] });
  const mainByggnad = new GeoJSONLayer({ title: "Main Buildings", url: "Main_byggnad.geojson", elevationInfo: { mode: "on-the-ground" }, renderer: buildingRenderer, outFields: ["*"] });
  const schoolLayer = new GeoJSONLayer({ title: "School", url: "Oxnehaga_school.geojson", renderer: simplePictureRenderer(ICONS.school, "26px"), elevationInfo: { mode: "on-the-ground" }, outFields: ["*"] });
  const schoolRoute = new GeoJSONLayer({ title: "Route from School to Train Station", url: "Oxnehaga_school_route.geojson", renderer: schoolRouteRenderer, outFields: ["*"] });
  const trainStation = new GeoJSONLayer({ title: "Train Station", url: "Huskvarna_train_station.geojson", renderer: simplePictureRenderer(ICONS.train, "28px"), elevationInfo: { mode: "on-the-ground" }, outFields: ["*"] });
  const trainLines = new GeoJSONLayer({ title: "Train Line", url: "train.geojson", renderer: trainLineRenderer, outFields: ["*"] });
  const distansLayer = new GeoJSONLayer({ title: "Distance from City Center", url: "Distans_from_centrum.geojson", visible: false, renderer: distanceRenderer, outFields: ["*"] });
  const vardcentralWalking = new GeoJSONLayer({ title: "Healthcare Walking Distance Area", url: "Vardcentral_walking_distance.geojson", renderer: vardcentralWalkingRenderer, outFields: ["*"] });
  const kindergartenLayer = new GeoJSONLayer({ title: "Kindergarten", url: "Kinder_Garden.geojson", renderer: simplePictureRenderer(ICONS.kindergarten, "26px"), elevationInfo: { mode: "on-the-ground" }, outFields: ["*"] });

  map.addMany([areaLayer, mainByggnad, schoolLayer, schoolRoute, trainStation, trainLines, distansLayer, vardcentralWalking, kindergartenLayer]);

  // ---------------- SMART SERVICE POINT LAYER FROM GEOJSON ----------------
  async function createSmartServiceLayer(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Cannot load " + url);
    const geojson = await response.json();
    let oid = 1;

    const graphics = [];
    const counts = { bus:0, restaurant:0, hospital:0, school:0, kindergarten:0, train:0, other:0 };

    function addPoint(coords, properties) {
      if (!coords || coords.length < 2) return;
      const classified = classifyProperties(properties, "Service Points");
      counts[classified.key] = (counts[classified.key] || 0) + 1;
      graphics.push(new Graphic({
        geometry: { type: "point", longitude: coords[0], latitude: coords[1] },
        attributes: {
          ObjectID: oid++,
          name: getBestName(properties),
          category: classified.key,
          categoryLabel: classified.label,
          icon: classified.icon,
          details: JSON.stringify(properties || {}, null, 2)
        }
      }));
    }

    (geojson.features || []).forEach(feature => {
      const geometry = feature.geometry || {};
      const properties = feature.properties || {};
      if (geometry.type === "Point") addPoint(geometry.coordinates, properties);
      if (geometry.type === "MultiPoint") (geometry.coordinates || []).forEach(c => addPoint(c, properties));
    });

    document.getElementById("serviceStatus").innerHTML =
      `Loaded service points: ${graphics.length}<br>` +
      `🚌 ${counts.bus || 0} &nbsp; 🍽️ ${counts.restaurant || 0} &nbsp; 🏥 ${counts.hospital || 0}<br>` +
      `🏫 ${counts.school || 0} &nbsp; 🧒 ${counts.kindergarten || 0} &nbsp; 📍 ${counts.other || 0}`;

    return new FeatureLayer({
      title: "Smart Service Points",
      source: graphics,
      objectIdField: "ObjectID",
      fields: [
        { name: "ObjectID", alias: "ObjectID", type: "oid" },
        { name: "name", alias: "Name", type: "string" },
        { name: "category", alias: "Category", type: "string" },
        { name: "categoryLabel", alias: "Category Label", type: "string" },
        { name: "icon", alias: "Icon", type: "string" },
        { name: "details", alias: "Original Properties", type: "string" }
      ],
      geometryType: "point",
      spatialReference: { wkid: 4326 },
      renderer: serviceRenderer,
      elevationInfo: { mode: "on-the-ground" },
      outFields: ["*"]
    });
  }

  // ---------------- UI CONTROLS ----------------
  const controls = document.getElementById("controls");
  document.getElementById("project4Btn").onclick = () => { window.location.href = "Project4.html"; };

  function createDropdown(title, opened = false) {
    const container = document.createElement("div");
    container.className = "dropdown";
    const header = document.createElement("div");
    header.className = "dropdown-header";
    const text = document.createElement("span"); text.innerText = title;
    const arrow = document.createElement("span"); arrow.innerHTML = "▶"; arrow.className = "dropdown-arrow";
    header.appendChild(text); header.appendChild(arrow);
    const content = document.createElement("div"); content.className = "dropdown-content";
    content.style.display = opened ? "block" : "none";
    arrow.style.transform = opened ? "rotate(90deg)" : "rotate(0deg)";
    header.onclick = () => {
      const open = content.style.display === "block";
      content.style.display = open ? "none" : "block";
      arrow.style.transform = open ? "rotate(0deg)" : "rotate(90deg)";
    };
    container.appendChild(header); container.appendChild(content); controls.appendChild(container);
    return content;
  }

  function addToggle(label, layers, parent) {
    const div = document.createElement("div"); div.className = "layer-item";
    const chk = document.createElement("input"); chk.type = "checkbox"; chk.checked = layers.every(layer => layer.visible !== false);
    chk.onchange = (event) => { layers.forEach(layer => layer.visible = event.target.checked); };
    const span = document.createElement("span"); span.innerText = label;
    div.appendChild(chk); div.appendChild(span); parent.appendChild(div);
  }

  function buildInfoTable(attr) {
    let html = "<table>";
    Object.keys(attr || {}).forEach(key => {
      if (["ObjectID", "details"].includes(key)) return;
      const value = attr[key];
      if (value !== null && value !== undefined && value !== "") {
        html += `<tr><td class="attr-key">${key}</td><td>${value}</td></tr>`;
      }
    });

    if (attr?.details) {
      try {
        const details = JSON.parse(attr.details);
        Object.keys(details).forEach(key => {
          const value = details[key];
          if (value !== null && value !== undefined && value !== "") {
            html += `<tr><td class="attr-key">${key}</td><td>${value}</td></tr>`;
          }
        });
      } catch (e) {}
    }
    html += "</table>";
    return html;
  }

  function classifyClickedFeature(attr, layerTitle) {
    if (attr?.categoryLabel) return { label: attr.categoryLabel, icon: attr.icon || "📍" };
    return classifyProperties(attr || {}, layerTitle);
  }

  // ---------------- INITIALIZE ----------------
  async function init() {
    const serviceStatus = document.createElement("div");
    serviceStatus.id = "serviceStatus";
    serviceStatus.className = "status";
    serviceStatus.innerHTML = "Loading service points...";

    const generalGroup = createDropdown("General Information", true);
    addToggle("Area Boundary", [areaLayer], generalGroup);
    addToggle("Main Buildings", [mainByggnad], generalGroup);
    addToggle("Train Info", [trainStation, trainLines], generalGroup);

    const analysisGroup = createDropdown("Analysis");
    addToggle("Route from School to Train Station", [schoolLayer, schoolRoute], analysisGroup);
    addToggle("Healthcare Walking Distance Area", [vardcentralWalking], analysisGroup);
    addToggle("Distance From Center", [distansLayer], analysisGroup);

    const servicesGroup = createDropdown("Services", true);
    addToggle("Kindergarten", [kindergartenLayer], servicesGroup);

    let servicePointsLayer;
    try {
      servicePointsLayer = await createSmartServiceLayer("Bus_stop.geojson");
      map.add(servicePointsLayer);
      addToggle("Smart Service Points", [servicePointsLayer], servicesGroup);
      servicesGroup.appendChild(serviceStatus);
    } catch (error) {
      console.warn(error);
      serviceStatus.innerHTML = "Could not load Bus_stop.geojson. Check file name and location.";
      servicesGroup.appendChild(serviceStatus);
    }

    const legend = document.createElement("div");
    legend.innerHTML = `
      <hr style="opacity:0.2;margin:15px 0;">
      <div class="legend-row">🚌 Bus Stop</div>
      <div class="legend-row">🍽️ Restaurant / Cafe</div>
      <div class="legend-row">🏥 Healthcare</div>
      <div class="legend-row">🏫 School</div>
      <div class="legend-row">🧒 Kindergarten</div>
      <div class="legend-row">🚆 Train</div>`;
    controls.appendChild(legend);
  }

  init();

  // ---------------- CLICK / HIT TEST ----------------
  view.on("click", (event) => {
    view.hitTest(event).then((response) => {
      const results = response.results.filter(result => result.graphic && result.graphic.layer);
      if (!results.length) {
        document.getElementById("project4Btn").style.display = "none";
        document.getElementById("infoContent").innerHTML = "No feature selected.";
        return;
      }

      const graphic = results[0].graphic;
      const attr = graphic.attributes || {};
      const layerTitle = graphic.layer.title || "Selected Feature";
      const featureName = attr.name || getBestName(attr);
      const classified = classifyClickedFeature(attr, layerTitle);
      const project4Btn = document.getElementById("project4Btn");

      if (attr.objektidentitet === "86068c15-afde-4284-90fc-ad8735b25416") project4Btn.style.display = "";
      else project4Btn.style.display = "none";

      document.getElementById("infoContent").innerHTML = `
        <h3 class="feature-title">${classified.icon} ${featureName}</h3>
        <div class="feature-type">${classified.label}</div>
        <div class="small-note">Layer: ${layerTitle}</div>
        ${buildInfoTable(attr)}
      `;
    });
  });
});
</script>

</body>
</html>
