<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Urban Map - Oxnehaga</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">

<style>
html, body {
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  display:flex;
  font-family:'Segoe UI', sans-serif;
}

#sidePanel {
  width:280px;
  background:#1f2a38;
  color:white;
  padding:20px;
  overflow-y:auto;
}

#viewDiv {
  flex:1;
  height:100vh;
  position:relative;
}

#infoPanel {
  position:absolute;
  top:20px;
  right:20px;
  width:340px;
  max-height:75vh;
  overflow-y:auto;
  background:white;
  border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  border:1px solid #ccc;
  z-index:10;
}

.info-header {
  background:#4A90E2;
  color:white;
  padding:10px 15px;
  border-radius:8px 8px 0 0;
  font-weight:bold;
}

#infoContent {
  padding:15px;
  font-size:13px;
}

.layer-item {
  margin-bottom:8px;
  display:flex;
  align-items:center;
  background:rgba(255,255,255,0.1);
  padding:8px;
  border-radius:4px;
}

.layer-item input {
  margin-right:10px;
}

.dropdown {
  margin-bottom:10px;
}

.dropdown-header {
  cursor:pointer;
  font-weight:bold;
  padding:8px;
  background:rgba(255,255,255,0.15);
  border-radius:4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dropdown-arrow {
  transition:0.3s;
}

.dropdown-content {
  display:none;
  margin-top:5px;
  padding-left:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

td {
  padding:6px 4px;
  border-bottom:1px solid #eee;
  vertical-align:top;
}

.attr-key {
  font-weight:bold;
  color:#666;
  width:45%;
  font-size:11px;
  text-transform:uppercase;
}

#project4Btn {
  width:100%;
  padding:8px;
  background:#4A90E2;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:15px;
}

.feature-title {
  margin:0 0 8px 0;
  color:#4A90E2;
  font-size:18px;
}

.feature-type {
  display:inline-block;
  background:#eef5ff;
  color:#2b6cb0;
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:10px;
}

.small-note {
  font-size:12px;
  color:#666;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="sidePanel">
  <h2 style="color:#4A90E2;margin:0;">GIS Web Urban</h2>
  <p style="font-size:12px;opacity:0.8;margin-top:6px;">Oxnehaga Urban Services Map</p>
  <hr style="opacity:0.2;margin:15px 0;">
  <div id="controls"></div>
</div>

<div id="viewDiv">
  <div id="infoPanel">
    <div class="info-header">Feature Details</div>
    <button id="project4Btn" style="display:none;">Open Project 4</button>
    <div id="infoContent">Click on a feature to see its details.</div>
  </div>
</div>

<script src="https://js.arcgis.com/4.29/"></script>

<script>
require([
  "esri/Map",
  "esri/views/SceneView",
  "esri/layers/GeoJSONLayer",
  "esri/widgets/Home"
], function(Map, SceneView, GeoJSONLayer, Home) {

  // ---------------- MAP AND VIEW ----------------
  const map = new Map({
    basemap: "topo-vector",
    ground: "world-elevation"
  });

  const view = new SceneView({
    container: "viewDiv",
    map: map,
    camera: {
      position: {
        longitude: 14.2622409,
        latitude: 57.7781582,
        z: 5000
      },
      tilt: 0
    },
    popupEnabled: false
  });

  view.ui.add(new Home({ view: view }), "top-left");

  // ---------------- ICON URLS ----------------
  const ICONS = {
    bus: "https://static.arcgis.com/images/Symbols/Transportation/Bus.png",
    school: "https://static.arcgis.com/images/Symbols/Education/School.png",
    kindergarten: "https://static.arcgis.com/images/Symbols/PeoplePlaces/ChildCare.png",
    hospital: "https://static.arcgis.com/images/Symbols/Health/Hospital.png",
    restaurant: "https://static.arcgis.com/images/Symbols/PeoplePlaces/Restaurant.png",
    train: "https://static.arcgis.com/images/Symbols/Transportation/Train.png",
    defaultPoint: "https://static.arcgis.com/images/Symbols/Shapes/BluePin1LargeB.png"
  };

  function pictureSymbol(url, size) {
    return {
      type: "picture-marker",
      url: url,
      width: size || "26px",
      height: size || "26px"
    };
  }

  function simplePictureRenderer(url, size) {
    return {
      type: "simple",
      symbol: pictureSymbol(url, size)
    };
  }

  // ---------------- UNIQUE SERVICE RENDERER ----------------
  /*
    IMPORTANT:
    This renderer separates services based on attribute value.
    Your GeoJSON should have one of these fields:
    amenity / type / category / fclass / service
    Example values:
    bus_stop, bus, restaurant, cafe, hospital, clinic, doctors, school, kindergarten
  */

  const servicePointRenderer = {
    type: "unique-value",
    field: "amenity",
    defaultSymbol: pictureSymbol(ICONS.defaultPoint, "24px"),
    uniqueValueInfos: [
      { value: "bus_stop", symbol: pictureSymbol(ICONS.bus, "26px"), label: "Bus Stop" },
      { value: "bus", symbol: pictureSymbol(ICONS.bus, "26px"), label: "Bus Stop" },

      { value: "restaurant", symbol: pictureSymbol(ICONS.restaurant, "26px"), label: "Restaurant" },
      { value: "cafe", symbol: pictureSymbol(ICONS.restaurant, "26px"), label: "Cafe" },
      { value: "fast_food", symbol: pictureSymbol(ICONS.restaurant, "26px"), label: "Fast Food" },

      { value: "hospital", symbol: pictureSymbol(ICONS.hospital, "28px"), label: "Hospital" },
      { value: "clinic", symbol: pictureSymbol(ICONS.hospital, "28px"), label: "Clinic" },
      { value: "doctors", symbol: pictureSymbol(ICONS.hospital, "28px"), label: "Doctors" },
      { value: "healthcare", symbol: pictureSymbol(ICONS.hospital, "28px"), label: "Healthcare" },

      { value: "school", symbol: pictureSymbol(ICONS.school, "26px"), label: "School" },
      { value: "kindergarten", symbol: pictureSymbol(ICONS.kindergarten, "26px"), label: "Kindergarten" }
    ]
  };

  // ---------------- POLYGON / LINE RENDERERS ----------------

  const areaRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[0,0,0,0],
      outline:{ color:"#00aa00", width:3 }
    }
  };

  const trainLineRenderer = {
    type:"simple",
    symbol:{
      type:"simple-line",
      color:"#ff0000",
      width:4,
      style:"dash"
    }
  };

  const schoolRouteRenderer = {
    type:"simple",
    symbol:{
      type:"simple-line",
      color:"#8A2BE2",
      width:5
    }
  };

  const vardcentralWalkingRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[0,200,0,0.35],
      outline:{ color:[0,150,0], width:2 }
    }
  };

  const distanceRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[255,165,0,0.3],
      outline:{ color:[255,140,0], width:2 }
    }
  };

  // ---------------- BUILDING RENDERER ----------------

  const buildingRenderer = {
    type: "unique-value",
    field: "objektidentitet",
    defaultSymbol: {
      type: "polygon-3d",
      symbolLayers: [{
        type: "extrude",
        size: 2,
        material: { color: "#d9d9d9" },
        edges: { type: "solid", color: "#888", size: 0.6 }
      }]
    },
    uniqueValueInfos: [{
      value: "86068c15-afde-4284-90fc-ad8735b25416",
      symbol: {
        type: "polygon-3d",
        symbolLayers: [{
          type: "extrude",
          size: 2,
          material: { color: "#ff0000" },
          edges: { type: "solid", color: "#888", size: 0.6 }
        }]
      }
    }]
  };

  // ---------------- LAYERS ----------------

  const areaLayer = new GeoJSONLayer({
    title: "Oxnehaga Area Boundary",
    url: "Oxnehaga-Area.geojson",
    renderer: areaRenderer,
    outFields: ["*"]
  });

  const mainByggnad = new GeoJSONLayer({
    title: "Main Buildings",
    url: "Main_byggnad.geojson",
    elevationInfo: { mode: "on-the-ground" },
    renderer: buildingRenderer,
    outFields: ["*"]
  });

  const schoolLayer = new GeoJSONLayer({
    title: "School",
    url: "Oxnehaga_school.geojson",
    renderer: simplePictureRenderer(ICONS.school, "26px"),
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  const schoolRoute = new GeoJSONLayer({
    title: "Route from School to Train Station",
    url: "Oxnehaga_school_route.geojson",
    renderer: schoolRouteRenderer,
    outFields: ["*"]
  });

  const trainStation = new GeoJSONLayer({
    title: "Train Station",
    url: "Huskvarna_train_station.geojson",
    renderer: simplePictureRenderer(ICONS.train, "28px"),
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  const trainLines = new GeoJSONLayer({
    title: "Train Line",
    url: "train.geojson",
    renderer: trainLineRenderer,
    outFields: ["*"]
  });

  const distansLayer = new GeoJSONLayer({
    title: "Distance from City Center",
    url: "Distans_from_centrum.geojson",
    visible: false,
    renderer: distanceRenderer,
    outFields: ["*"]
  });

  const vardcentralWalking = new GeoJSONLayer({
    title: "Healthcare Walking Distance Area",
    url: "Vardcentral_walking_distance.geojson",
    renderer: vardcentralWalkingRenderer,
    outFields: ["*"]
  });

  const kindergartenLayer = new GeoJSONLayer({
    title: "Kindergarten",
    url: "Kinder_Garden.geojson",
    renderer: simplePictureRenderer(ICONS.kindergarten, "26px"),
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  /*
    This is now named Service Points, not Bus Stop.
    Use this for mixed points: bus stops, restaurants, hospitals, cafes, etc.
    If your file contains only bus stops, it will still work.
  */
  const servicePointsLayer = new GeoJSONLayer({
    title: "Service Points",
    url: "Bus_stop.geojson",
    renderer: servicePointRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  /*
    Optional separate files:
    Keep these only if you really have Hospital.geojson and Restaurant.geojson.
    If not available, they simply show warning in console.
  */
  const hospitalLayer = new GeoJSONLayer({
    title: "Hospital / Healthcare",
    url: "Hospital.geojson",
    renderer: simplePictureRenderer(ICONS.hospital, "28px"),
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"],
    visible: true
  });

  const restaurantLayer = new GeoJSONLayer({
    title: "Restaurant",
    url: "Restaurant.geojson",
    renderer: simplePictureRenderer(ICONS.restaurant, "26px"),
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"],
    visible: true
  });

  map.addMany([
    areaLayer,
    mainByggnad,
    schoolLayer,
    schoolRoute,
    trainStation,
    trainLines,
    distansLayer,
    vardcentralWalking,
    kindergartenLayer,
    servicePointsLayer,
    hospitalLayer,
    restaurantLayer
  ]);

  // ---------------- DIAGNOSTICS ----------------

  function checkLayer(layer, label) {
    layer.when(() => layer.queryFeatureCount())
      .then(count => console.log("[" + label + "] feature count:", count))
      .catch(error => console.warn("[" + label + "] could not load:", error));
  }

  checkLayer(servicePointsLayer, "Service Points");
  checkLayer(schoolLayer, "School");
  checkLayer(kindergartenLayer, "Kindergarten");
  checkLayer(trainStation, "Train Station");
  checkLayer(hospitalLayer, "Hospital");
  checkLayer(restaurantLayer, "Restaurant");

  // ---------------- UI CONTROLS ----------------

  const controls = document.getElementById("controls");

  document.getElementById("project4Btn").onclick = () => {
    window.location.href = "Project4.html";
  };

  function createDropdown(title) {
    const container = document.createElement("div");
    container.className = "dropdown";

    const header = document.createElement("div");
    header.className = "dropdown-header";

    const text = document.createElement("span");
    text.innerText = title;

    const arrow = document.createElement("span");
    arrow.innerHTML = "▶";
    arrow.className = "dropdown-arrow";

    header.appendChild(text);
    header.appendChild(arrow);

    const content = document.createElement("div");
    content.className = "dropdown-content";

    header.onclick = () => {
      const open = content.style.display === "block";
      content.style.display = open ? "none" : "block";
      arrow.style.transform = open ? "rotate(0deg)" : "rotate(90deg)";
    };

    container.appendChild(header);
    container.appendChild(content);
    controls.appendChild(container);

    return content;
  }

  function addToggle(label, layers, parent) {
    const div = document.createElement("div");
    div.className = "layer-item";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = layers.every(layer => layer.visible !== false);

    chk.onchange = (event) => {
      layers.forEach(layer => layer.visible = event.target.checked);
    };

    const span = document.createElement("span");
    span.innerText = label;

    div.appendChild(chk);
    div.appendChild(span);
    parent.appendChild(div);
  }

  const generalGroup = createDropdown("General Information");
  addToggle("Area Boundary", [areaLayer], generalGroup);
  addToggle("Main Buildings", [mainByggnad], generalGroup);
  addToggle("Train Info", [trainStation, trainLines], generalGroup);

  const analysisGroup = createDropdown("Analysis");
  addToggle("Route from School to Train Station", [schoolLayer, schoolRoute], analysisGroup);
  addToggle("Healthcare Walking Distance Area", [vardcentralWalking], analysisGroup);
  addToggle("Distance From Center", [distansLayer], analysisGroup);

  const servicesGroup = createDropdown("Services");
  addToggle("All Service Points", [servicePointsLayer], servicesGroup);
  addToggle("Kindergarten", [kindergartenLayer], servicesGroup);
  addToggle("School", [schoolLayer], servicesGroup);
  addToggle("Hospitals / Healthcare", [hospitalLayer], servicesGroup);
  addToggle("Restaurants", [restaurantLayer], servicesGroup);

  // ---------------- FEATURE CLASSIFICATION ----------------

  function getAttrValue(attr, keys) {
    if (!attr) return "";

    for (const key of keys) {
      if (attr[key] !== undefined && attr[key] !== null && String(attr[key]).trim() !== "") {
        return String(attr[key]).trim();
      }
    }

    return "";
  }

  function getBestName(attr) {
    return getAttrValue(attr, [
      "name", "Name", "NAME",
      "namn", "Namn", "NAMN",
      "title", "Title", "TITLE",
      "operator", "Operator",
      "objektidentitet"
    ]) || "Unknown feature";
  }

  function classifyFeature(attr, layerTitle) {
    const raw = (
      getAttrValue(attr, [
        "amenity", "Amenity", "AMENITY",
        "type", "Type", "TYPE",
        "category", "Category", "CATEGORY",
        "fclass", "FCLASS",
        "service", "Service",
        "highway", "Highway",
        "public_transport",
        "shop", "Shop"
      ]) + " " +
      getBestName(attr) + " " +
      layerTitle
    ).toLowerCase();

    if (raw.includes("bus_stop") || raw.includes("bus stop") || raw.includes("bus")) {
      return { label: "Bus Stop", icon: "🚌" };
    }

    if (raw.includes("restaurant") || raw.includes("cafe") || raw.includes("fast_food") || raw.includes("food") || raw.includes("pizza") || raw.includes("grill")) {
      return { label: "Restaurant / Food Place", icon: "🍽️" };
    }

    if (raw.includes("hospital") || raw.includes("clinic") || raw.includes("doctor") || raw.includes("healthcare") || raw.includes("vård") || raw.includes("vard") || raw.includes("medical")) {
      return { label: "Hospital / Healthcare", icon: "🏥" };
    }

    if (raw.includes("kindergarten") || raw.includes("förskola") || raw.includes("forskola") || raw.includes("childcare")) {
      return { label: "Kindergarten", icon: "🧒" };
    }

    if (raw.includes("school") || raw.includes("skola")) {
      return { label: "School", icon: "🏫" };
    }

    if (raw.includes("train") || raw.includes("station") || raw.includes("railway")) {
      return { label: "Train Station / Railway", icon: "🚆" };
    }

    if (raw.includes("building") || raw.includes("byggnad")) {
      return { label: "Building", icon: "🏢" };
    }

    if (raw.includes("area") || raw.includes("boundary")) {
      return { label: "Area / Boundary", icon: "🗺️" };
    }

    return { label: layerTitle || "Selected Feature", icon: "📍" };
  }

  function buildInfoTable(attr) {
    let tableHTML = "<table>";

    for (let key in attr) {
      if (attr[key] !== null && attr[key] !== undefined && attr[key] !== "") {
        tableHTML += `
          <tr>
            <td class="attr-key">${key}</td>
            <td>${attr[key]}</td>
          </tr>
        `;
      }
    }

    tableHTML += "</table>";
    return tableHTML;
  }

  // ---------------- CLICK / HIT TEST ----------------

  view.on("click", (event) => {
    view.hitTest(event).then((response) => {

      const results = response.results.filter(result =>
        result.graphic &&
        result.graphic.layer &&
        result.graphic.layer.type === "geojson"
      );

      if (results.length > 0) {

        const graphic = results[0].graphic;
        const attr = graphic.attributes;
        const layerTitle = graphic.layer.title || "Selected Feature";
        const featureName = getBestName(attr);
        const classified = classifyFeature(attr, layerTitle);

        const project4Btn = document.getElementById("project4Btn");

        if (attr && attr.objektidentitet === "86068c15-afde-4284-90fc-ad8735b25416") {
          project4Btn.style.display = "";
        } else {
          project4Btn.style.display = "none";
        }

        const html = `
          <h3 class="feature-title">${classified.icon} ${featureName}</h3>
          <div class="feature-type">${classified.label}</div>
          <div class="small-note">Layer: ${layerTitle}</div>
          ${buildInfoTable(attr)}
        `;

        document.getElementById("infoContent").innerHTML = html;

      } else {
        document.getElementById("project4Btn").style.display = "none";
        document.getElementById("infoContent").innerHTML = "No feature selected.";
      }

    });
  });

});
</script>

</body>
</html>
