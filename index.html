<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Urban Map - Oxnehaga</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">

<style>
html, body {
  height:100%;
  width:100%;
  margin:0;
  padding:0;
  display:flex;
  font-family:'Segoe UI', sans-serif;
}

#sidePanel {
  width:280px;
  background:#1f2a38;
  color:white;
  padding:20px;
  overflow-y:auto;
}

#viewDiv {
  flex:1;
  height:100vh;
  position:relative;
}

#infoPanel {
  position:absolute;
  top:20px;
  right:20px;
  width:340px;
  max-height:75vh;
  overflow-y:auto;
  background:white;
  border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  border:1px solid #ccc;
  z-index:10;
}

.info-header {
  background:#4A90E2;
  color:white;
  padding:10px 15px;
  border-radius:8px 8px 0 0;
  font-weight:bold;
}

#infoContent {
  padding:15px;
  font-size:13px;
}

.layer-item {
  margin-bottom:8px;
  display:flex;
  align-items:center;
  background:rgba(255,255,255,0.1);
  padding:8px;
  border-radius:4px;
}

.layer-item input {
  margin-right:10px;
}

.dropdown {
  margin-bottom:10px;
}

.dropdown-header {
  cursor:pointer;
  font-weight:bold;
  padding:8px;
  background:rgba(255,255,255,0.15);
  border-radius:4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dropdown-arrow {
  transition:0.3s;
}

.dropdown-content {
  display:none;
  margin-top:5px;
  padding-left:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

td {
  padding:6px 4px;
  border-bottom:1px solid #eee;
  vertical-align:top;
}

.attr-key {
  font-weight:bold;
  color:#666;
  width:45%;
  font-size:11px;
  text-transform:uppercase;
}

#project4Btn {
  width:100%;
  padding:8px;
  background:#4A90E2;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:15px;
}

.feature-title {
  margin:0 0 8px 0;
  color:#4A90E2;
  font-size:18px;
}

.feature-type {
  display:inline-block;
  background:#eef5ff;
  color:#2b6cb0;
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:10px;
}

.small-note {
  font-size:12px;
  color:#666;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="sidePanel">
  <h2 style="color:#4A90E2;margin:0;">GIS Web Urban</h2>
  <p style="font-size:12px;opacity:0.8;margin-top:6px;">Oxnehaga Urban Services Map</p>
  <hr style="opacity:0.2;margin:15px 0;">
  <div id="controls"></div>
</div>

<div id="viewDiv">
  <div id="infoPanel">
    <div class="info-header">Feature Details</div>
    <button id="project4Btn" style="display:none;">Open Project 4</button>
    <div id="infoContent">Click on a feature to see its details.</div>
  </div>
</div>

<script src="https://js.arcgis.com/4.29/"></script>

<script>
require([
  "esri/Map",
  "esri/views/SceneView",
  "esri/layers/GeoJSONLayer",
  "esri/widgets/Home"
], function(Map, SceneView, GeoJSONLayer, Home) {

  // ---------------- MAP AND VIEW ----------------
  const map = new Map({
    basemap: "topo-vector",
    ground: "world-elevation"
  });

  const view = new SceneView({
    container: "viewDiv",
    map: map,
    camera: {
      position: {
        longitude: 14.2622409,
        latitude: 57.7781582,
        z: 5000
      },
      tilt: 0
    },
    popupEnabled: false
  });

  view.ui.add(new Home({ view: view }), "top-left");

  // ---------------- ICON RENDERERS ----------------

  const busRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/Transportation/Bus.png",
      width: "26px",
      height: "26px"
    }
  };

  const schoolRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/Education/School.png",
      width: "26px",
      height: "26px"
    }
  };

  const kindergartenRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/PeoplePlaces/ChildCare.png",
      width: "26px",
      height: "26px"
    }
  };

  const hospitalRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/Health/Hospital.png",
      width: "28px",
      height: "28px"
    }
  };

  const restaurantRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/PeoplePlaces/Restaurant.png",
      width: "26px",
      height: "26px"
    }
  };

  const trainStationRenderer = {
    type: "simple",
    symbol: {
      type: "picture-marker",
      url: "https://static.arcgis.com/images/Symbols/Transportation/Train.png",
      width: "28px",
      height: "28px"
    }
  };

  // ---------------- POLYGON / LINE RENDERERS ----------------

  const areaRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[0,0,0,0],
      outline:{ color:"#00aa00", width:3 }
    }
  };

  const trainLineRenderer = {
    type:"simple",
    symbol:{
      type:"simple-line",
      color:"#ff0000",
      width:4,
      style:"dash"
    }
  };

  const schoolRouteRenderer = {
    type:"simple",
    symbol:{
      type:"simple-line",
      color:"#8A2BE2",
      width:5
    }
  };

  const vardcentralWalkingRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[0,200,0,0.35],
      outline:{ color:[0,150,0], width:2 }
    }
  };

  const distanceRenderer = {
    type:"simple",
    symbol:{
      type:"simple-fill",
      color:[255,165,0,0.3],
      outline:{ color:[255,140,0], width:2 }
    }
  };

  // ---------------- BUILDING RENDERER ----------------

  const buildingRenderer = {
    type: "unique-value",
    field: "objektidentitet",
    defaultSymbol: {
      type: "polygon-3d",
      symbolLayers: [{
        type: "extrude",
        size: 2,
        material: { color: "#d9d9d9" },
        edges: { type: "solid", color: "#888", size: 0.6 }
      }]
    },
    uniqueValueInfos: [{
      value: "86068c15-afde-4284-90fc-ad8735b25416",
      symbol: {
        type: "polygon-3d",
        symbolLayers: [{
          type: "extrude",
          size: 2,
          material: { color: "#ff0000" },
          edges: { type: "solid", color: "#888", size: 0.6 }
        }]
      }
    }]
  };

  // ---------------- LAYERS ----------------

  const areaLayer = new GeoJSONLayer({
    title: "Oxnehaga Area Boundary",
    url: "Oxnehaga-Area.geojson",
    renderer: areaRenderer,
    outFields: ["*"]
  });

  const mainByggnad = new GeoJSONLayer({
    title: "Main Buildings",
    url: "Main_byggnad.geojson",
    elevationInfo: { mode: "on-the-ground" },
    renderer: buildingRenderer,
    outFields: ["*"]
  });

  const schoolLayer = new GeoJSONLayer({
    title: "School",
    url: "Oxnehaga_school.geojson",
    renderer: schoolRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  const schoolRoute = new GeoJSONLayer({
    title: "Route from School to Train Station",
    url: "Oxnehaga_school_route.geojson",
    renderer: schoolRouteRenderer,
    outFields: ["*"]
  });

  const trainStation = new GeoJSONLayer({
    title: "Train Station",
    url: "Huskvarna_train_station.geojson",
    renderer: trainStationRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  const trainLines = new GeoJSONLayer({
    title: "Train Line",
    url: "train.geojson",
    renderer: trainLineRenderer,
    outFields: ["*"]
  });

  const distansLayer = new GeoJSONLayer({
    title: "Distance from City Center",
    url: "Distans_from_centrum.geojson",
    visible: false,
    renderer: distanceRenderer,
    outFields: ["*"]
  });

  const vardcentralWalking = new GeoJSONLayer({
    title: "Healthcare Walking Distance",
    url: "Vardcentral_walking_distance.geojson",
    renderer: vardcentralWalkingRenderer,
    outFields: ["*"]
  });

  const kindergartenLayer = new GeoJSONLayer({
    title: "Kindergarten",
    url: "Kinder_Garden.geojson",
    renderer: kindergartenRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  const busStopLayer = new GeoJSONLayer({
    title: "Bus Stop",
    url: "Bus_stop.geojson",
    renderer: busRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"]
  });

  /*
    IMPORTANT:
    Add these GeoJSON files to your project folder if you have them.
    If you do not have these files yet, keep these layers commented.
  */

  const hospitalLayer = new GeoJSONLayer({
    title: "Hospital / Healthcare",
    url: "Hospital.geojson",
    renderer: hospitalRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"],
    visible: true
  });

  const restaurantLayer = new GeoJSONLayer({
    title: "Restaurant",
    url: "Restaurant.geojson",
    renderer: restaurantRenderer,
    elevationInfo: { mode: "on-the-ground" },
    outFields: ["*"],
    visible: true
  });

  // Add layers to map
  map.addMany([
    areaLayer,
    mainByggnad,
    schoolLayer,
    schoolRoute,
    trainStation,
    trainLines,
    distansLayer,
    vardcentralWalking,
    kindergartenLayer,
    busStopLayer,
    hospitalLayer,
    restaurantLayer
  ]);

  // ---------------- LAYER LOADING DIAGNOSTICS ----------------

  function checkLayer(layer, label) {
    layer.when(() => layer.queryFeatureCount())
      .then(count => console.log("[" + label + "] feature count:", count))
      .catch(error => console.warn("[" + label + "] could not load:", error));
  }

  checkLayer(busStopLayer, "Bus Stop");
  checkLayer(schoolLayer, "School");
  checkLayer(kindergartenLayer, "Kindergarten");
  checkLayer(trainStation, "Train Station");
  checkLayer(hospitalLayer, "Hospital");
  checkLayer(restaurantLayer, "Restaurant");

  // ---------------- UI CONTROLS ----------------

  const controls = document.getElementById("controls");

  document.getElementById("project4Btn").onclick = () => {
    window.location.href = "Project4.html";
  };

  function createDropdown(title) {
    const container = document.createElement("div");
    container.className = "dropdown";

    const header = document.createElement("div");
    header.className = "dropdown-header";

    const text = document.createElement("span");
    text.innerText = title;

    const arrow = document.createElement("span");
    arrow.innerHTML = "▶";
    arrow.className = "dropdown-arrow";

    header.appendChild(text);
    header.appendChild(arrow);

    const content = document.createElement("div");
    content.className = "dropdown-content";

    header.onclick = () => {
      const open = content.style.display === "block";
      content.style.display = open ? "none" : "block";
      arrow.style.transform = open ? "rotate(0deg)" : "rotate(90deg)";
    };

    container.appendChild(header);
    container.appendChild(content);
    controls.appendChild(container);

    return content;
  }

  function addToggle(label, layers, parent) {
    const div = document.createElement("div");
    div.className = "layer-item";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = layers.every(layer => layer.visible !== false);

    chk.onchange = (event) => {
      layers.forEach(layer => layer.visible = event.target.checked);
    };

    const span = document.createElement("span");
    span.innerText = label;

    div.appendChild(chk);
    div.appendChild(span);
    parent.appendChild(div);
  }

  const generalGroup = createDropdown("General Information");
  addToggle("Area Boundary", [areaLayer], generalGroup);
  addToggle("Main Buildings", [mainByggnad], generalGroup);
  addToggle("Train Info", [trainStation, trainLines], generalGroup);

  const analysisGroup = createDropdown("Analysis");
  addToggle("Route from School to Train Station", [schoolLayer, schoolRoute], analysisGroup);
  addToggle("Healthcare Walking Distance", [vardcentralWalking], analysisGroup);
  addToggle("Distance From Center", [distansLayer], analysisGroup);

  const servicesGroup = createDropdown("Services");
  addToggle("Kindergarten", [kindergartenLayer], servicesGroup);
  addToggle("School", [schoolLayer], servicesGroup);
  addToggle("Bus Stops", [busStopLayer], servicesGroup);
  addToggle("Hospitals / Healthcare", [hospitalLayer], servicesGroup);
  addToggle("Restaurants", [restaurantLayer], servicesGroup);

  // ---------------- HELPER FUNCTIONS FOR FEATURE IDENTIFICATION ----------------

  function getBestName(attr) {
    if (!attr) return "Unknown feature";

    return attr.name ||
           attr.Name ||
           attr.namn ||
           attr.Namn ||
           attr.NAME ||
           attr.title ||
           attr.Title ||
           attr.TITLE ||
           attr.amenity ||
           attr.AMENITY ||
           attr.type ||
           attr.Type ||
           attr.TYPE ||
           attr.objektidentitet ||
           "Unknown feature";
  }

  function getFeatureIcon(layerTitle) {
    const title = layerTitle.toLowerCase();

    if (title.includes("bus")) return "🚌";
    if (title.includes("school")) return "🏫";
    if (title.includes("kindergarten")) return "🧒";
    if (title.includes("hospital") || title.includes("healthcare")) return "🏥";
    if (title.includes("restaurant")) return "🍽️";
    if (title.includes("train")) return "🚆";
    if (title.includes("building")) return "🏢";
    if (title.includes("area")) return "🗺️";

    return "📍";
  }

  function buildInfoTable(attr) {
    let tableHTML = "<table>";

    for (let key in attr) {
      if (attr[key] !== null && attr[key] !== undefined && attr[key] !== "") {
        tableHTML += `
          <tr>
            <td class="attr-key">${key}</td>
            <td>${attr[key]}</td>
          </tr>
        `;
      }
    }

    tableHTML += "</table>";
    return tableHTML;
  }

  // ---------------- CLICK / HIT TEST ----------------

  view.on("click", (event) => {
    view.hitTest(event).then((response) => {

      const results = response.results.filter(result =>
        result.graphic &&
        result.graphic.layer &&
        result.graphic.layer.type === "geojson"
      );

      if (results.length > 0) {

        const graphic = results[0].graphic;
        const attr = graphic.attributes;
        const layerTitle = graphic.layer.title || "Selected Feature";
        const featureName = getBestName(attr);
        const icon = getFeatureIcon(layerTitle);

        const project4Btn = document.getElementById("project4Btn");

        if (attr && attr.objektidentitet === "86068c15-afde-4284-90fc-ad8735b25416") {
          project4Btn.style.display = "";
        } else {
          project4Btn.style.display = "none";
        }

        let html = `
          <h3 class="feature-title">${icon} ${featureName}</h3>
          <div class="feature-type">${layerTitle}</div>
          <div class="small-note">All available attributes are shown below.</div>
          ${buildInfoTable(attr)}
        `;

        document.getElementById("infoContent").innerHTML = html;

      } else {
        document.getElementById("project4Btn").style.display = "none";
        document.getElementById("infoContent").innerHTML = "No feature selected.";
      }

    });
  });

});
</script>

</body>
</html>
