<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oxnehaga Urban Services Map</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
<style>
html,body{height:100%;width:100%;margin:0;padding:0;display:flex;font-family:'Segoe UI',Arial,sans-serif}#sidePanel{width:300px;background:#1f2a38;color:white;padding:18px;overflow-y:auto;box-sizing:border-box}#viewDiv{flex:1;height:100vh;position:relative}.brand{color:#58a6ff;margin:0;font-size:23px}.sub{font-size:12px;opacity:.8;margin-top:6px}.section-title{margin-top:18px;margin-bottom:8px;font-size:13px;color:#9fd0ff;text-transform:uppercase;letter-spacing:.5px}.layer-item{margin-bottom:8px;display:flex;align-items:center;background:rgba(255,255,255,.1);padding:8px;border-radius:6px;font-size:14px}.layer-item input{margin-right:10px}.legend-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.legend-symbol{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid white}.dropdown-header{cursor:pointer;font-weight:bold;padding:9px;background:rgba(255,255,255,.15);border-radius:6px;display:flex;justify-content:space-between}.dropdown-content{display:none;margin-top:6px;padding-left:4px}.dropdown{margin-bottom:10px}#infoPanel{position:absolute;top:20px;right:20px;width:370px;max-height:78vh;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:10}.info-header{background:#4A90E2;color:white;padding:14px 18px;border-radius:10px 10px 0 0;font-size:20px;font-weight:700}#infoContent{padding:18px;font-size:14px}.feature-title{margin:0 0 10px;color:#2f78d6;font-size:20px}.feature-type{display:inline-block;padding:6px 10px;border-radius:14px;font-size:13px;margin-bottom:12px;background:#eef5ff;color:#2b6cb0}.small-note{font-size:12px;color:#666;margin-bottom:12px}table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:top}.attr-key{font-weight:700;color:#666;width:42%;font-size:11px;text-transform:uppercase}#project4Btn{width:100%;padding:9px;background:#4A90E2;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-bottom:12px}.status{font-size:12px;opacity:.78;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div id="sidePanel">
  <h2 class="brand">GIS Web Urban</h2>
  <p class="sub">Oxnehaga Urban Services Map</p>
  <hr style="opacity:.2;margin:15px 0">
  <div class="section-title">Layer Controls</div>
  <div id="controls"></div>
  <div class="section-title">Service Legend</div>
  <div id="legend"></div>
  <div class="status" id="statusText">Loading map layers...</div>
</div>
<div id="viewDiv">
  <div id="infoPanel">
    <div class="info-header">Feature Details</div>
    <div id="infoContent">Click on any symbol to see place name, category and attributes.</div>
  </div>
</div>
<script src="https://js.arcgis.com/4.29/"></script>
<script>
require(["esri/Map","esri/views/SceneView","esri/layers/GeoJSONLayer","esri/widgets/Home"],
function(Map,SceneView,GeoJSONLayer,Home){

const map=new Map({basemap:"topo-vector",ground:"world-elevation"});
const view=new SceneView({container:"viewDiv",map,camera:{position:{longitude:14.2622409,latitude:57.7781582,z:5000},tilt:0},popupEnabled:false});
view.ui.add(new Home({view}),"top-left");

const TYPE_META={
  bus_stop:{label:"Bus Stop",icon:"🚌",color:[0,122,255],style:"circle"},
  hospital:{label:"Hospital / Healthcare",icon:"🏥",color:[220,0,0],style:"cross"},
  restaurant:{label:"Restaurant / Food",icon:"🍽️",color:[255,132,0],style:"diamond"},
  school:{label:"School",icon:"🏫",color:[142,68,173],style:"square"},
  kindergarten:{label:"Kindergarten",icon:"🧒",color:[46,204,113],style:"triangle"},
  train:{label:"Train Station / Railway",icon:"🚆",color:[40,40,40],style:"x"},
  other:{label:"Other Service",icon:"📍",color:[80,160,255],style:"circle"}
};
function marker(meta,size=14){return{type:"simple-marker",style:meta.style,size:size,color:meta.color,outline:{color:[255,255,255],width:1.5}};}
function serviceRenderer(){return{type:"unique-value",field:"__category",defaultSymbol:marker(TYPE_META.other),uniqueValueInfos:Object.keys(TYPE_META).map(k=>({value:k,label:TYPE_META[k].label,symbol:marker(TYPE_META[k],k==='hospital'?17:15)}))};}
function lineRenderer(color,width=4,style="solid"){return{type:"simple",symbol:{type:"simple-line",color,width,style}};}
function fillRenderer(color,outline,width=2){return{type:"simple",symbol:{type:"simple-fill",color,outline:{color:outline,width}}};}

function getVal(p,keys){for(const k of keys){if(p && p[k]!==undefined && p[k]!==null && String(p[k]).trim()!=="")return String(p[k]).trim();}return"";}
function bestName(p){return getVal(p,["name","Name","NAME","namn","Namn","NAMN","HPLNAMN","hplnamn","title","operator","Operator","objektidentitet","OBJECTID","NR"])||"Unnamed place";}
function classify(p,fallback){
  const text=(Object.values(p||{}).join(" ")+" "+fallback).toLowerCase();
  if(text.match(/hospital|clinic|doctor|healthcare|medical|vård|vard|vårdcentral|vardcentral|sjukhus|hälsa|halsa/))return"hospital";
  if(text.match(/restaurant|restaurang|cafe|café|fast_food|food|pizza|grill|kebab|thai|sushi|pizzeria/))return"restaurant";
  if(text.match(/kindergarten|förskola|forskola|preschool|childcare|dagis/))return"kindergarten";
  if(text.match(/school|skola|gymnasium/))return"school";
  if(text.match(/train|railway|station|järnväg|jarnvag/))return"train";
  if(text.match(/bus_stop|bus stop|hållplats|hallplats|hplnamn|turer_per|bus/))return"bus_stop";
  return fallback || "other";
}
async function processedGeoJsonUrl(file,fallbackCategory){
  const res=await fetch(file,{cache:"no-store"});
  if(!res.ok)throw new Error(file+" not found");
  const data=await res.json();
  if(data.features){
    data.features.forEach((f,i)=>{
      f.properties=f.properties||{};
      const cat=classify(f.properties,fallbackCategory);
      f.properties.__category=cat;
      f.properties.__category_label=TYPE_META[cat]?.label||TYPE_META.other.label;
      f.properties.__display_name=bestName(f.properties);
      f.properties.__source_file=file;
    });
  }
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  return URL.createObjectURL(blob);
}

const baseLayers=[];
baseLayers.push(new GeoJSONLayer({title:"Oxnehaga Area Boundary",url:"Oxnehaga-Area.geojson",renderer:fillRenderer([0,200,0,.28],[0,145,40],3),outFields:["*"]}));
baseLayers.push(new GeoJSONLayer({title:"Main Buildings",url:"Main_byggnad.geojson",elevationInfo:{mode:"on-the-ground"},renderer:{type:"simple",symbol:{type:"polygon-3d",symbolLayers:[{type:"extrude",size:2,material:{color:"#d9d9d9"},edges:{type:"solid",color:"#777",size:.5}}]}},outFields:["*"]}));
baseLayers.push(new GeoJSONLayer({title:"Route from School to Train Station",url:"Oxnehaga_school_route.geojson",renderer:lineRenderer("#6f42c1",5),outFields:["*"]}));
baseLayers.push(new GeoJSONLayer({title:"Train Line",url:"train.geojson",renderer:lineRenderer("#ff0000",4,"dash"),outFields:["*"]}));
baseLayers.push(new GeoJSONLayer({title:"Distance From City Center",url:"Distans_from_centrum.geojson",visible:false,renderer:fillRenderer([255,165,0,.25],[255,140,0],2),outFields:["*"]}));
baseLayers.push(new GeoJSONLayer({title:"Healthcare Walking Distance Area",url:"Vardcentral_walking_distance.geojson",renderer:fillRenderer([0,180,0,.2],[0,120,0],2),outFields:["*"]}));
map.addMany(baseLayers);

const SERVICE_FILES=[
  {title:"Bus Stops",file:"Bus_stop.geojson",fallback:"bus_stop",visible:true},
  {title:"Schools",file:"Oxnehaga_school.geojson",fallback:"school",visible:true},
  {title:"Kindergartens",file:"Kinder_Garden.geojson",fallback:"kindergarten",visible:true},
  {title:"Train Station",file:"Huskvarna_train_station.geojson",fallback:"train",visible:true},
  {title:"Hospitals / Healthcare",file:"Hospital.geojson",fallback:"hospital",visible:true,optional:true},
  {title:"Restaurants / Food",file:"Restaurant.geojson",fallback:"restaurant",visible:true,optional:true},
  {title:"Mixed Service Points",file:"Service_points.geojson",fallback:"other",visible:true,optional:true}
];
const serviceLayers=[];
(async function initServiceLayers(){
  let loaded=0, skipped=[];
  for(const s of SERVICE_FILES){
    try{
      const url=await processedGeoJsonUrl(s.file,s.fallback);
      const layer=new GeoJSONLayer({title:s.title,url,renderer:serviceRenderer(),elevationInfo:{mode:"on-the-ground"},outFields:["*"],visible:s.visible});
      layer.__group="services";
      serviceLayers.push(layer); map.add(layer); loaded++;
    }catch(e){ if(!s.optional) console.warn(e); else skipped.push(s.file); }
  }
  buildControls(); buildLegend();
  document.getElementById("statusText").innerHTML=`Loaded ${loaded} service point layers. Optional missing files skipped: ${skipped.length?skipped.join(", "):"none"}.`;
})();

function createDropdown(title,open=false){const c=document.createElement("div");c.className="dropdown";const h=document.createElement("div");h.className="dropdown-header";h.innerHTML=`<span>${title}</span><span>${open?'▼':'▶'}</span>`;const body=document.createElement("div");body.className="dropdown-content";body.style.display=open?"block":"none";h.onclick=()=>{const isOpen=body.style.display==='block';body.style.display=isOpen?'none':'block';h.lastChild.textContent=isOpen?'▶':'▼';};c.appendChild(h);c.appendChild(body);document.getElementById("controls").appendChild(c);return body;}
function addToggle(label,layers,parent){const div=document.createElement("div");div.className="layer-item";const chk=document.createElement("input");chk.type="checkbox";chk.checked=layers.every(l=>l.visible!==false);chk.onchange=e=>layers.forEach(l=>l.visible=e.target.checked);div.appendChild(chk);div.appendChild(document.createTextNode(label));parent.appendChild(div);}
function buildControls(){const controls=document.getElementById("controls");controls.innerHTML="";const g=createDropdown("General Information",true);addToggle("Area Boundary",[baseLayers[0]],g);addToggle("Main Buildings",[baseLayers[1]],g);addToggle("Train Line",[baseLayers[3]],g);const a=createDropdown("Analysis",false);addToggle("School Route",[baseLayers[2]],a);addToggle("Healthcare Walking Area",[baseLayers[5]],a);addToggle("Distance From Center",[baseLayers[4]],a);const s=createDropdown("Service Points",true);serviceLayers.forEach(l=>addToggle(l.title,[l],s));}
function buildLegend(){const legend=document.getElementById("legend");legend.innerHTML="";Object.keys(TYPE_META).filter(k=>k!=='other').forEach(k=>{const m=TYPE_META[k];const row=document.createElement("div");row.className="legend-row";row.innerHTML=`<span class="legend-symbol" style="background:rgb(${m.color[0]},${m.color[1]},${m.color[2]})"></span><span>${m.icon} ${m.label}</span>`;legend.appendChild(row);});}
function cleanAttr(attr){const skip={__category:1,__category_label:1,__source_file:1};let html="<table>";Object.keys(attr||{}).forEach(k=>{if(skip[k])return;const v=attr[k];if(v!==null&&v!==undefined&&String(v)!=="")html+=`<tr><td class="attr-key">${k}</td><td>${v}</td></tr>`;});return html+"</table>";}
view.on("click",event=>{view.hitTest(event).then(r=>{const hit=r.results.find(x=>x.graphic&&x.graphic.layer&&x.graphic.layer.type==="geojson");if(!hit){document.getElementById("infoContent").innerHTML="No feature selected.";return;}const a=hit.graphic.attributes||{};const cat=a.__category||classify(a,"other");const meta=TYPE_META[cat]||TYPE_META.other;const name=a.__display_name||bestName(a);document.getElementById("infoContent").innerHTML=`<h3 class="feature-title">${meta.icon} ${name}</h3><div class="feature-type">${meta.label}</div><div class="small-note">Layer: ${hit.graphic.layer.title}</div>${cleanAttr(a)}`;});});
});
</script>
</body>
</html>
